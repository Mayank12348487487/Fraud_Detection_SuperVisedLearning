<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Glow (Subtle) -->
  <path d="M256,40 C160,80 120,120 120,220 C120,340 210,420 256,460 C302,420 392,340 392,220 C392,120 352,80 256,40 Z" fill="url(#shield-grad)" opacity="0.15" filter="url(#glow)" />
  <!-- Main Shield Outline -->
  <path d="M256,55 C175,92 140,130 140,220 C140,325 218,397 256,435 C294,397 372,325 372,220 C372,130 337,92 256,55 Z" fill="none" stroke="url(#shield-grad)" stroke-width="24" stroke-linejoin="round" />
  <!-- Inner AI / Checkmark/Shield core -->
  <path d="M256,90 C200,120 175,150 175,220 C175,300 230,360 256,390 C282,360 337,300 337,220 C337,150 312,120 256,90 Z" fill="#0b0f19" stroke="url(#glow-grad)" stroke-width="12" />
  <!-- Center AI Node and connections -->
  <circle cx="256" cy="220" r="28" fill="url(#glow-grad)" filter="url(#glow)" />
  <line x1="256" y1="160" x2="256" y2="192" stroke="url(#glow-grad)" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="248" x2="256" y2="280" stroke="url(#glow-grad)" stroke-width="6" stroke-linecap="round" />
  <line x1="196" y1="220" x2="228" y2="220" stroke="url(#glow-grad)" stroke-width="6" stroke-linecap="round" />
  <line x1="284" y1="220" x2="316" y2="220" stroke="url(#glow-grad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="160" r="10" fill="#00ff87" />
  <circle cx="256" cy="280" r="10" fill="#00ff87" />
  <circle cx="196" cy="220" r="10" fill="#00ff87" />
  <circle cx="316" cy="220" r="10" fill="#00ff87" />
</svg>
